{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% trans "Регистрация" %}{% endblock %}

{% block content %}
<h1 class="mb-4">{% trans "Регистрация студента" %}</h1>
<div class="form-card">
  <form method="post">
    {% csrf_token %}
    {% include 'includes/form_fields.html' %}
    <button class="btn btn-dark w-100">{% trans "Создать аккаунт" %}</button>
  </form>
  <p class="mt-3 mb-0 small">{% trans "Уже есть аккаунт?" %} <a href="{% url 'login' %}">{% trans "Войти" %}</a></p>
</div>
{% endblock %}
